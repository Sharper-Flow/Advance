name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, trunk]

concurrency:
  group: auto-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST_TAG"

      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          echo "Commits since ${LAST_TAG}:"
          echo "$COMMITS"

          if [ -z "$COMMITS" ]; then
            echo "No new commits since last tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false
          HAS_OTHER=false

          while IFS= read -r line; do
            if echo "$line" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              HAS_BREAKING=true
            fi
            if echo "$line" | grep -qE '^feat(\(.+\))?:'; then
              HAS_FEAT=true
            fi
            if echo "$line" | grep -qE '^fix(\(.+\))?:'; then
              HAS_FIX=true
            fi
            if echo "$line" | grep -qE '^[a-z]+(\(.+\))?:'; then
              HAS_OTHER=true
            fi
          done <<< "$COMMITS"

          CURRENT="${LAST_TAG#v}"
          CURRENT="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUMP="major"
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1)); PATCH=0; BUMP="minor"
          elif [ "$HAS_FIX" = true ] || [ "$HAS_OTHER" = true ]; then
            PATCH=$((PATCH + 1)); BUMP="patch"
          else
            echo "No conventional commits found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump: $BUMP ($LAST_TAG → $NEW_TAG)"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"

          # Gather commits since last tag.
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")

          # Gather typed release-notes sidecars from archived ADV changes.
          # Build a JSON array of envelopes; render_body (scripts/release-body.sh)
          # handles per-envelope parsing, schema_version guard, headline fallback,
          # category bucketing, chore(adv) commit filtering, and section ordering.
          RN_FILES=$(git diff --name-only "${LAST_TAG}..HEAD" -- '.adv/archive/*/release-notes.json' 2>/dev/null || true)
          RN_JSON="["
          RN_SEP=""
          if [ -n "$RN_FILES" ]; then
            while IFS= read -r rn_file; do
              if [ -z "$rn_file" ]; then continue; fi
              CONTENT=$(git show "HEAD:$rn_file" 2>/dev/null || true)
              if [ -z "$CONTENT" ]; then continue; fi
              # Validate as JSON before appending; skip on parse failure.
              if echo "$CONTENT" | jq -e . >/dev/null 2>&1; then
                RN_JSON="${RN_JSON}${RN_SEP}${CONTENT}"
                RN_SEP=","
              fi
            done <<< "$RN_FILES"
          fi
          RN_JSON="${RN_JSON}]"

          # Delegate body construction to the tested helper.
          # See scripts/release-body.sh and scripts/test-release-body.sh.
          source scripts/release-body.sh
          BODY=$(render_body "$COMMITS" "$RN_JSON")

          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"
          # Tags only — CHANGELOG.md updates land via normal PRs (avoids
          # bypassing branch protection's required status checks on trunk).
          git push origin "$NEW_TAG"

      - name: Setup Node.js
        if: steps.bump.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Install pnpm
        if: steps.bump.outputs.skip != 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Install dependencies
        if: steps.bump.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Build plugin
        if: steps.bump.outputs.skip != 'true'
        run: pnpm run build
        working-directory: plugin

      - name: Create release archive
        if: steps.bump.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.bump.outputs.new_tag }}"
          ARCHIVE_ROOT="advance-${VERSION}"
          ARCHIVE="advance-${VERSION}.tar.gz"
          rm -rf dist
          mkdir -p dist
          tar -czf "dist/${ARCHIVE}" \
            --transform "s,^,${ARCHIVE_ROOT}/," \
            README.md \
            SETUP.md \
            ADV_INSTRUCTIONS.md \
            AGENTS.md \
            project.md \
            project.json \
            install.sh \
            bin \
            scripts \
            .opencode/command \
            .opencode/agents \
            .opencode/overlays \
            skills \
            plugin/dist \
            plugin/src \
            plugin/package.json \
            plugin/pnpm-lock.yaml \
            plugin/tsconfig.json \
            plugin/tsup.config.ts \
            plugin/vitest.config.ts
          tar -tzf "dist/${ARCHIVE}" > "dist/${ARCHIVE}.contents.txt"
          for required in \
            "${ARCHIVE_ROOT}/plugin/dist/index.js" \
            "${ARCHIVE_ROOT}/plugin/src/index.ts" \
            "${ARCHIVE_ROOT}/plugin/package.json" \
            "${ARCHIVE_ROOT}/plugin/pnpm-lock.yaml" \
            "${ARCHIVE_ROOT}/scripts/deploy-local.sh" \
            "${ARCHIVE_ROOT}/bin/adv" \
            "${ARCHIVE_ROOT}/bin/lib/live-status.ts" \
            "${ARCHIVE_ROOT}/install.sh" \
            "${ARCHIVE_ROOT}/.opencode/command/" \
            "${ARCHIVE_ROOT}/.opencode/agents/" \
            "${ARCHIVE_ROOT}/.opencode/overlays/" \
            "${ARCHIVE_ROOT}/skills/" \
            "${ARCHIVE_ROOT}/README.md" \
            "${ARCHIVE_ROOT}/SETUP.md" \
            "${ARCHIVE_ROOT}/ADV_INSTRUCTIONS.md" \
            "${ARCHIVE_ROOT}/AGENTS.md" \
            "${ARCHIVE_ROOT}/project.md" \
            "${ARCHIVE_ROOT}/project.json"
          do
            grep -qxF "$required" "dist/${ARCHIVE}.contents.txt"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum "${ARCHIVE}" install.sh > SHA256SUMS.txt)

      - name: Create Release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          files: |
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}

      - name: Summary
        if: steps.bump.outputs.skip != 'true'
        run: |
          echo "## Auto Release 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "**${{ steps.bump.outputs.new_tag }}** (${{ steps.bump.outputs.bump }} from ${{ steps.last_tag.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip summary
        if: steps.bump.outputs.skip == 'true'
        run: echo "## No Release Needed" >> "$GITHUB_STEP_SUMMARY"
