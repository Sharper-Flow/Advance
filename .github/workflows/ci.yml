name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: SDK parity
        run: pnpm run check:sdk-parity
        working-directory: plugin
        env:
          CI: "true"

      - name: Schema drift check
        run: pnpm run schemas:check
        working-directory: plugin

      - name: Type check
        run: pnpm run typecheck
        working-directory: plugin

      - name: Lint
        run: pnpm run lint
        working-directory: plugin

      - name: Format check
        run: pnpm run format:check
        working-directory: plugin

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.local"

      - name: Build worker bundle for OOP integration tests
        run: pnpm run build:worker
        working-directory: plugin

      - name: Verify candidate worker bundle
        run: pnpm run verify:worker-bundle
        working-directory: plugin

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install Bun
        # opencode-session-debt.test.ts shells out to `bun` to seed a bun:sqlite
        # database under the OpenCode debt-doctor scenario. Without bun on PATH
        # the test fails with `spawnSync bun ENOENT`. Bun is OpenCode's runtime;
        # keeping it on the CI runner mirrors the production environment.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test
        run: pnpm test
        working-directory: plugin

      # The bin CLI suite contains live-Temporal assertions — for example
      # "adv epic list --json" asserts source == "temporal", live == true and
      # stale == false. Those need a real server on the ADV defaults
      # (127.0.0.1:7233, namespace "default"; see plugin/src/temporal/contracts.ts).
      #
      # No step ever started one. The suite passed anyway because the vitest
      # step above leaks temporal-test-server processes that the bin tests
      # silently connected to — the same leak bin/lib/oc-test-reaper.bash
      # exists to clean up. Once the vitest suite stopped erroring and shut
      # down cleanly, the leak disappeared and these tests began failing.
      #
      # Start the server explicitly so the dependency is declared rather than
      # inherited from another step's garbage. Deliberately placed AFTER the
      # vitest step so it cannot contend with the SDK's own ephemeral test
      # servers.
      - name: Start Temporal dev server for bin CLI tests
        run: |
          temporal server start-dev --headless --ip 127.0.0.1 --port 7233 &
          for i in $(seq 1 60); do
            if temporal operator namespace describe default >/dev/null 2>&1; then
              echo "Temporal dev server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal dev server did not become ready within 60s" >&2
          exit 1

      - name: Test bin CLI (Bun)
        run: bun test bin/
        working-directory: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Build
        run: pnpm run build
        working-directory: plugin
