name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Install Bun
        # dead-code:check and opencode-session-debt.test.ts require `bun` on PATH.
        # Installing it before the ratchet makes the mandatory check runnable.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Dead-code ratchet
        run: pnpm run dead-code:check
        working-directory: plugin

      - name: SDK parity
        run: pnpm run check:sdk-parity
        working-directory: plugin
        env:
          CI: "true"

      - name: Schema drift check
        run: pnpm run schemas:check
        working-directory: plugin

      - name: Type check
        run: pnpm run typecheck
        working-directory: plugin

      - name: Lint
        run: pnpm run lint
        working-directory: plugin

      - name: Format check
        run: pnpm run format:check
        working-directory: plugin

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.local"

      - name: Test
        run: pnpm test
        working-directory: plugin

      - name: Build plugin bundle for CLI parity
        run: pnpm run build
        working-directory: plugin

      - name: Test bin CLI (Bun)
        run: bun test bin/
        working-directory: .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Build
        run: pnpm run build
        working-directory: plugin
